<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f6f7f3">
  <meta name="description" content="2026 징검다리 수련회 운영 체크리스트와 현장 큐시트">
  <title>징검다리 수련회 · 운영 데스크</title>
  <style>:root {
  color-scheme: light;
  --paper:#f5f6f2; --white:#fff; --ink:#172923; --muted:#56665d; --line:#e1e7df;
  --green:#245545; --green-dark:#12392e; --mint:#e5f0e8; --amber:#805316; --amber-soft:#faf0dc;
  --sidebar:220px; --radius:18px;
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
}
* { box-sizing:border-box }
body { margin:0; background:var(--paper); color:var(--ink); font-size:14px; line-height:1.55; word-break:keep-all; overflow-wrap:anywhere }
button,input,select,textarea { font:inherit; color:inherit }
button { cursor:pointer }
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible { outline:3px solid #589175; outline-offset:3px }
button:disabled { cursor:default; opacity:.55 }
svg { display:block; flex:none }
h1,h2,h3,p { margin:0 }
h1,h2,h3,strong { letter-spacing:-.035em }
.skip { position:fixed; top:8px; left:8px; z-index:10; padding:9px 16px; background:white; transform:translateY(-150%) }
.skip:focus { transform:none }
.sidebar { position:fixed; inset:0 auto 0 0; width:var(--sidebar); display:flex; flex-direction:column; background:#fcfdfb; border-right:1px solid var(--line); padding:27px 15px 21px; z-index:2 }
.brand { display:flex; gap:12px; align-items:center; padding:0 9px; margin-bottom:47px }
.brand-icon { width:40px; height:40px; display:grid; place-items:center; border-radius:12px; background:var(--green-dark); color:#e5f1e2 }
.brand strong { display:block; font-size:18px; line-height:1.2 }
.brand small,.sidebar-foot small { display:block; color:var(--muted); font-size:11px; margin-top:4px }
.nav-label { color:var(--muted); font-size:11px; font-weight:700; padding:0 11px; margin-bottom:10px }
#nav { display:grid; gap:5px }
.nav-item { display:flex; gap:12px; align-items:center; width:100%; border:0; border-radius:10px; background:transparent; color:var(--muted); padding:11px 12px; text-align:left; font-weight:650; white-space:nowrap }
.nav-item:hover,.nav-item[aria-current=page] { background:var(--mint); color:var(--green-dark) }
.nav-item[aria-current=page] { font-weight:800 }
.sidebar-foot { display:flex; gap:11px; align-items:center; padding:14px 9px 0; border-top:1px solid var(--line); margin-top:auto }
.sidebar-foot strong { font-size:12px; font-variant-numeric:tabular-nums }
.mini-calendar { color:var(--green) }
.workspace { margin-left:var(--sidebar) }
.topbar { height:63px; display:flex; justify-content:space-between; align-items:center; padding:0 32px; border-bottom:1px solid var(--line); background:#fcfdfb; gap:10px }
.breadcrumbs { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12px; white-space:nowrap }
.breadcrumbs strong { color:var(--ink) }
.storage { display:flex; gap:7px; align-items:center; padding:6px 10px; color:var(--green); background:var(--white); border:1px solid var(--line); border-radius:99px; font-size:11px; font-weight:700; white-space:nowrap }
.storage:hover { background:var(--mint) }
.storage-dot { width:7px; height:7px; background:#4e8767; border-radius:50% }
.storage[data-warning] .storage-dot { background:#af6d1e }
main,.footer { max-width:1320px; margin-inline:auto; padding-inline:32px }
main { padding-top:28px; min-height:calc(100vh - 127px) }
main:focus { outline:none }
.footer { display:flex; justify-content:space-between; align-items:center; gap:12px; padding-top:23px; padding-bottom:24px; color:var(--muted); font-size:11px }
.hero { position:relative; isolation:isolate; overflow:hidden; display:flex; align-items:center; min-height:212px; padding:30px 35px; color:#f9fbf4; background:var(--green-dark); border-radius:22px }
.hero-copy { position:relative; z-index:1 }
.hero-art { position:absolute; right:0; bottom:0; width:58%; height:100%; opacity:.93; pointer-events:none }
.kicker { color:#b4d7bf; font-size:11px; font-weight:800; letter-spacing:.15em; display:flex; align-items:center; gap:8px }
.kicker::before { content:""; width:14px; height:1px; background:#a7cdb0 }
.hero h1 { font-size:clamp(32px,4vw,49px); line-height:1.13; margin:10px 0 9px; letter-spacing:-.07em }
.hero p { color:#d9e6db; font-size:14px }
.hero-meta { display:flex; flex-wrap:wrap; gap:8px 19px; margin-top:21px; color:#e4eee5; font-size:12px }
.hero-meta span { display:inline-flex; align-items:center; gap:7px }
.stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin:16px 0 27px }
.stat { position:relative; background:white; border:1px solid var(--line); border-radius:15px; padding:15px 16px 14px; text-align:left; min-width:0 }
.stat:hover { border-color:#99b8a6; background:#fbfdfb }
.stat-label { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; font-weight:700 }
.stat-value { display:flex; align-items:baseline; gap:4px; margin:3px 0 1px }
.stat-value strong { font-size:28px; font-variant-numeric:tabular-nums; line-height:1.3 }
.stat-value span { color:var(--muted); font-size:12px }
.stat-sub { font-size:11px; color:var(--muted) }
.stat-icon { width:28px; height:28px; border-radius:8px; display:grid; place-items:center; background:var(--mint); color:var(--green) }
.stat:nth-child(2) .stat-icon { background:var(--amber-soft); color:var(--amber) }
.meter { display:block; background:#edf1eb; height:4px; border-radius:10px; overflow:hidden; margin-top:8px }
.meter span { display:block; background:#5a926d; height:100%; border-radius:inherit }
.section-head { display:flex; align-items:baseline; gap:10px; margin:0 0 12px; justify-content:space-between }
.section-head h2 { font-size:20px }
.muted { color:var(--muted); font-size:12px }
.day-strip { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:7px; margin-bottom:15px }
.day-button { border:1px solid var(--line); background:white; border-radius:10px; padding:8px 4px; min-height:58px; text-align:center; color:var(--muted) }
.day-button:hover { border-color:#8aa997 }
.day-button strong { display:block; font-size:16px; color:var(--ink); font-variant-numeric:tabular-nums }
.day-button span { font-size:11px }
.day-button[aria-pressed=true] { background:var(--green); border-color:var(--green); color:#dcebe0 }
.day-button[aria-pressed=true] strong { color:white }
.overview-grid { display:grid; grid-template-columns:minmax(0,1.22fr) minmax(0,1fr); gap:14px; align-items:start }
.panel { padding:18px 19px; background:white; border:1px solid var(--line); border-radius:var(--radius); min-width:0 }
.panel-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:9px }
.panel-head h3 { font-size:16px }
.agenda { display:grid }
.agenda div { display:grid; grid-template-columns:64px minmax(0,1fr); gap:10px; padding:10px 0; border-top:1px solid #eff1ec }
.agenda div:first-child { border:0 }
.agenda strong { color:var(--green); font-size:12px; padding-top:2px }
.agenda p { font-size:13px }
.agenda .finish { background:#f3f7f1; border:0; border-radius:9px; padding:9px 10px; margin-top:6px }
.text-button { background:none; border:0; color:var(--green); font-weight:750; padding:3px 0; text-align:left; font-size:12px }
.text-button:hover { text-decoration:underline }
.page-head { margin-bottom:20px }
.page-kicker { color:var(--green); font-size:11px; font-weight:800; letter-spacing:.14em; margin-bottom:6px }
.page-head h1 { font-size:clamp(29px,4vw,40px); line-height:1.2; margin-bottom:8px }
.page-head p { color:var(--muted); font-size:13px }
.toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:white; border:1px solid var(--line); border-radius:13px; padding:10px; margin-bottom:10px }
.search { display:flex; gap:7px; align-items:center; min-width:min(100%,210px); flex:1 1 220px; color:var(--muted); border:1px solid var(--line); padding:0 9px; border-radius:8px; background:#f8faf7 }
.search input { width:100%; min-width:0; border:0; outline-offset:1px; background:transparent; padding:8px 2px }
select,.field input,.field textarea { border:1px solid var(--line); background:#f8faf7; border-radius:8px; min-height:38px; padding:7px 9px }
.results-meta { display:flex; align-items:center; justify-content:space-between; gap:8px; color:var(--muted); padding:4px 1px 9px; font-size:12px }
.list { display:grid; gap:7px }
.task { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:8px; align-items:center; border:1px solid var(--line); border-radius:12px; background:white; padding:5px 10px 5px 8px }
.panel .task { border-width:1px 0 0; border-radius:0; padding-inline:0 }
.panel .task:first-child { border:0 }
.tick { display:grid; place-items:center; border:1px solid #b8c7be; border-radius:7px; width:29px; height:29px; background:white; color:var(--green); margin:4px }
.tick:hover { background:var(--mint) }
.tick[aria-pressed=true] { background:var(--green); color:white; border-color:var(--green) }
.task-link { display:block; width:100%; text-align:left; border:0; background:transparent; padding:7px 2px; min-width:0 }
.task-link:hover strong { text-decoration:underline; text-underline-offset:3px }
.task-link strong { display:block; font-size:14px }
.task-link small { color:var(--muted); font-size:11px; display:block; margin-top:1px }
.task.is-done .task-link strong { color:var(--muted) }
.badge { display:inline-flex; align-items:center; width:max-content; max-width:100%; border-radius:99px; padding:3px 8px; font-size:11px; font-weight:750; white-space:nowrap; background:#edf0eb; color:#4d5b53 }
.badge.done,.badge.standard { background:var(--mint); color:var(--green-dark) }
.badge.active { background:#e8eff7; color:#335879 }
.badge.warn { background:var(--amber-soft); color:var(--amber) }
.empty { padding:26px 12px; text-align:center; background:white; border:1px dashed #c7d3ca; border-radius:12px; color:var(--muted) }
.segment { display:inline-flex; gap:3px; border:1px solid var(--line); border-radius:10px; background:#e9eee8; padding:3px; margin-bottom:12px }
.segment button { border:0; border-radius:7px; background:transparent; padding:7px 12px; color:var(--muted); font-size:13px; font-weight:700 }
.segment button[aria-pressed=true] { background:white; color:var(--green-dark); box-shadow:0 1px 4px #203a2617 }
.cue { display:grid; grid-template-columns:145px minmax(0,1fr); gap:12px; align-items:start }
.cue-time { padding:12px 8px 0 0; color:var(--green-dark); font-variant-numeric:tabular-nums; font-size:14px; font-weight:800 }
.cue-time small { display:block; color:var(--muted); font-weight:600; font-size:11px }
.cue-card,.booth-card { width:100%; min-width:0; border:1px solid var(--line); background:white; border-radius:12px; padding:12px 14px; text-align:left }
.cue-card:hover,.booth-card:hover { border-color:#96b4a2; background:#fcfdfb }
.cue-card strong,.booth-card strong { display:block; font-size:15px; margin:2px 0 }
.cue-card small,.booth-card small { color:var(--muted); font-size:12px }
.cue-card-top { display:flex; align-items:center; flex-wrap:wrap; gap:5px 8px }
.cue-card p { margin-top:6px; font-size:13px; color:var(--muted) }
.notice { display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:11px; background:var(--amber-soft); color:#674812; margin-bottom:12px; font-size:13px }
.notice svg { margin-top:2px }
.booths { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px }
.booth-card { display:grid; grid-template-columns:38px minmax(0,1fr); gap:10px; align-items:start }
.booth-num { display:grid; place-items:center; height:38px; border-radius:9px; background:var(--mint); color:var(--green); font-weight:800; font-variant-numeric:tabular-nums }
.booth-card .badge { margin-top:7px }
dialog { color:var(--ink); border:1px solid var(--line); border-radius:20px; background:white; width:min(560px,calc(100vw - 22px)); max-height:min(90dvh,780px); padding:0; box-shadow:0 20px 80px #11271d50; overscroll-behavior:contain }
dialog::backdrop { background:#11291f68 }
body:has(dialog[open]) { overflow:hidden }
.dialog-head { position:sticky; z-index:1; top:0; display:flex; justify-content:space-between; gap:14px; align-items:flex-start; padding:18px 20px 13px; background:white; border-bottom:1px solid var(--line) }
.dialog-head h2 { font-size:21px; line-height:1.35; margin-top:4px }
.dialog-head p { color:var(--green); font-size:11px; font-weight:800; letter-spacing:.08em }
.icon-button { display:grid; place-items:center; border:1px solid var(--line); border-radius:9px; background:white; width:34px; height:34px; flex:none }
.icon-button:hover { background:var(--mint) }
.dialog-body { padding:16px 20px 20px }
.detail { margin:0 0 14px; display:grid; gap:8px }
.detail div { display:grid; grid-template-columns:91px minmax(0,1fr); gap:10px; font-size:13px }
.detail dt { color:var(--muted); font-weight:700 }
.detail dd { margin:0; white-space:pre-wrap }
.callout { background:#f2f6f0; padding:11px 13px; border-radius:10px; margin:8px 0 13px; font-size:13px; white-space:pre-wrap }
.callout strong { display:block; margin-bottom:3px; color:var(--green) }
.field { display:grid; gap:5px; font-size:13px; font-weight:700; margin-top:10px }
.field textarea { resize:vertical; min-height:76px; font-weight:400 }
.field input,.field select { width:100%; font-weight:400 }
.dialog-actions { display:flex; flex-wrap:wrap; justify-content:flex-end; align-items:center; gap:8px; margin-top:16px }
.primary,.secondary { border:1px solid var(--green); background:var(--green); color:white; border-radius:8px; font-size:13px; font-weight:750; padding:8px 12px }
.primary:hover { background:var(--green-dark) }
.secondary { background:white; border-color:var(--line); color:var(--green) }
.secondary:hover { background:var(--mint) }
.source-list { margin:8px 0 0; padding-left:20px; font-size:13px }
.source-list li + li { margin-top:6px }
#toast { position:fixed; z-index:3; bottom:16px; left:calc(50% + var(--sidebar)/2); transform:translateX(-50%); padding:8px 15px; background:var(--green-dark); color:white; border-radius:12px; pointer-events:none; font-size:13px; width:max-content; max-width:calc(100% - 24px); box-shadow:0 4px 16px #173c2a33 }
#toast:empty { display:none }
@media (max-width:1100px) {
  :root { --sidebar:188px }
  .topbar,main,.footer { padding-inline:23px }
}
@media (max-width:820px) {
  :root { --sidebar:0px }
  .sidebar { position:sticky; top:0; width:100%; padding:9px 15px; border-right:0; border-bottom:1px solid var(--line) }
  .brand,.nav-label,.sidebar-foot { display:none }
  #nav { grid-template-columns:repeat(4,minmax(0,1fr)) }
  .nav-item { justify-content:center; padding:8px 5px; gap:5px; font-size:12px }
  .nav-item svg { width:16px; height:16px }
  .topbar { height:47px }
  main { padding-top:17px }
}
@media (max-width:590px) {
  .topbar,main,.footer { padding-inline:13px }
  .hero { min-height:184px; padding:22px 17px; border-radius:15px }
  .hero h1 { font-size:clamp(26px,8vw,36px) }
  .hero p { font-size:12px }
  .hero-meta { gap:4px 11px; margin-top:15px; font-size:11px }
  .hero-art { opacity:.4; width:80% }
  .stats { gap:6px; margin:10px 0 20px }
  .stat { padding:9px 7px; border-radius:10px }
  .stat-label { gap:4px; font-size:10px }
  .stat-icon { width:20px; height:20px; border-radius:6px }
  .stat-icon svg { width:13px; height:13px }
  .stat-value strong { font-size:23px }
  .stat-value span,.stat-sub { font-size:10px }
  .day-strip { gap:4px }
  .day-button { min-height:50px; padding:5px 2px }
  .day-button strong { font-size:14px }
  .overview-grid,.booths { grid-template-columns:1fr }
  .panel { padding:13px 12px }
  .cue { grid-template-columns:1fr; gap:2px }
  .cue-time { padding:8px 2px 2px; display:flex; align-items:baseline; gap:8px }
  .task { gap:4px; padding-inline:4px 7px }
  .task-link strong { font-size:13px }
  .dialog-head,.dialog-body { padding-inline:14px }
}
@media (max-width:375px) {
  .nav-item { flex-direction:column; gap:2px; font-size:11px }
}
@media (prefers-reduced-motion:no-preference) {
  button { transition:background-color .14s,border-color .14s }
}
</style>
</head>
<body>
  <a class="skip" href="#content">본문 바로가기</a>
  <aside class="sidebar">
    <div class="brand"><span class="brand-icon" aria-hidden="true"></span><span><strong>징검다리</strong><small>수련회 운영 데스크</small></span></div>
    <div class="nav-label">워크스페이스</div>
    <nav id="nav" aria-label="주 메뉴"></nav>
    <div class="sidebar-foot"><span class="mini-calendar" aria-hidden="true"></span><div><strong>2026. 11. 13–14</strong><small>청춘산장리조트</small></div></div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div class="breadcrumbs"><span>2026 수련회</span><span aria-hidden="true">/</span><strong id="breadcrumb">개요</strong></div>
      <button id="storage" class="storage" type="button"><span class="storage-dot"></span><span id="storage-label">이 브라우저에 저장</span></button>
    </header>
    <main id="content" tabindex="-1"></main>
    <footer class="footer"><span>원본 기준 2026. 11. 09. 23:39</span><button type="button" class="text-button" data-action="sources">원본 및 근거 보기 <span aria-hidden="true">↗</span></button></footer>
  </div>

  const storageKey = `retreat-ops:v1:${data.key}`;
  const main = document.getElementById('content');
  const nav = document.getElementById('nav');
  const dialog = document.getElementById('dialog');
  const dialogContent = document.getElementById('dialog-content');
  const now = new Intl.DateTimeFormat('sv-SE', {
    timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit',
  }).format(new Date());
  let records = freshRecords();
  let storageAvailable = true;
  let dayIndex = data.days.findIndex(day => dateOnly(day.date) === now);
  if (dayIndex < 0) dayIndex = 1;
  let filters = freshFilters();
  let cueDay = 'friday';
  let cueQuery = '';
  let timingFilter = '';
  let view = readView();
  let toastTimer;
  let returnFocus;

  try {
    const saved = localStorage.getItem(storageKey);
    if (saved) records = validateRecords(JSON.parse(saved));
    localStorage.setItem(storageKey, JSON.stringify(records));
  } catch {
    storageAvailable = false;
  }

  function h(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    })[char]);
  }

  function icon(name, size = 19) {
    return `<svg aria-hidden="true" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${icons[name]}</svg>`;
  }

  function validateRecords(value) {
    if (!value || typeof value !== 'object' || Array.isArray(value)) throw new Error('잘못된 기록 형식입니다.');
    const clean = freshRecords();
    for (const [kind, catalog] of [['tasks', taskMap], ['booths', boothMap]]) {
      const group = value[kind];
      if (!group || typeof group !== 'object' || Array.isArray(group)) throw new Error('잘못된 기록 형식입니다.');
      for (const [id, row] of Object.entries(group)) {
        if (!catalog.has(id) || !row || !statuses.includes(row.status) ||
            typeof row.memo !== 'string' || row.memo.length > 4000) {
          throw new Error('읽을 수 없는 항목이 포함되어 있습니다.');
        }
        clean[kind][id] = {status: row.status, memo: row.memo};
        if (kind === 'tasks' && statuses.includes(row.beforeDone) && row.beforeDone !== '완료') {
          clean.tasks[id].beforeDone = row.beforeDone;
        }
        if (kind === 'booths') {
          if (row.minutes !== null && (!Number.isFinite(row.minutes) || row.minutes < 0)) {
            throw new Error('부스 실측 시간은 0 이상의 숫자로 입력해야 합니다.');
          }
          clean.booths[id].minutes = row.minutes;
        }
      }
    }
    return clean;
  }

  function updateStorageLabel() {
    document.getElementById('storage').toggleAttribute('data-warning', !storageAvailable);
    document.getElementById('storage-label').textContent = storageAvailable ? '이 브라우저에 저장' : '브라우저 저장 제한';
  }

  function persist(message) {
    try {
      localStorage.setItem(storageKey, JSON.stringify(records));
      storageAvailable = true;
      notify(message);
    } catch {
      storageAvailable = false;
      notify('이 창에 기록했습니다. 창을 닫기 전에 백업해 주세요.');
    }
    updateStorageLabel();
  }

  function notify(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.textContent = ''; }, 3600);
  }

  function dateOnly(value) {
    return value?.slice(0, 10) ?? '';
  }

  function shortDate(value) {
    return `${Number(value.slice(5, 7))}/${Number(value.slice(8, 10))}`;
  }

  function statusTone(status) {
    if (status === '완료') return 'done';
    if (status === '진행') return 'active';
    return needsReview(status) ? 'warn' : '';
  }

  function badge(label, tone = '') {
    return `<span class="badge ${tone}">${h(label)}</span>`;
  }

  function currentTask(task) {
    return {...task, ...records.tasks[task.id]};
  }

  function readView() {
    const slug = location.hash.slice(1);
    return Object.hasOwn(views, slug) ? slug : 'overview';
  }

  function navigate(next) {
    if (view !== next) {
      history.pushState(null, '', `#${next}`);
      view = next;
      window.scrollTo(0, 0);
    }
    render();
    main.focus({preventScroll: true});
  }

  function render() {
    nav.innerHTML = Object.entries(views).map(([id, [label, symbol]]) =>
      `<button class="nav-item" type="button" data-action="nav" data-id="${id}"${view === id ? ' aria-current="page"' : ''}>${icon(symbol)}<span>${label}</span></button>`
    ).join('');
    document.getElementById('breadcrumb').textContent = views[view][0];
    main.innerHTML = {overview: overviewPage, checklist: checklistPage, cues: cuePage, booths: boothPage}[view]();
    renderResults();
  }

  function art() {
    return `<svg class="hero-art" viewBox="0 0 650 230" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">
      <defs><linearGradient id="hero-fade"><stop stop-color="#12392e" stop-opacity="0"/><stop offset="1" stop-color="#12392e"/></linearGradient></defs>
      <path d="M165 230C239 158 264 193 319 141s87-38 126-70S552 19 650 34v196Z" fill="#1e4939"/>
      <path d="M254 230c74-46 122-22 166-68s120-50 230-38v106Z" fill="#285642"/>
      <g fill="none" stroke="#80ae88" stroke-opacity=".41">
        <path d="M126 230C207 177 267 178 312 140S401 96 441 65 531 19 650 33"/>
        <path d="M154 234c76-47 118-35 171-83s94-41 136-74S553 37 650 48"/>
        <path d="M190 234c70-38 110-26 160-68s89-39 128-66S572 55 650 68"/>
        <path d="M223 235c68-26 110-21 160-59s72-32 118-56S583 77 650 85"/>
        <path d="M277 235c56-21 100-21 142-51s65-30 102-46S607 99 650 105"/>
        <path d="M332 234c45-14 93-24 137-48s88-58 181-56"/>
        <path d="M385 234c58-15 104-32 153-57s84-27 112-28"/>
      </g>
      <g fill="#d1e2bc">
        <path d="M278 180c12-5 36-4 47 0l5 6c-13 5-45 5-56 0z" opacity=".66"/>
        <path d="M357 149c12-4 32-4 41-1l5 5c-12 4-39 5-49 1z" opacity=".73"/>
        <path d="M429 120c10-4 26-4 35-1l5 4c-10 4-34 4-42 0z" opacity=".8"/>
        <path d="M498 92c9-3 25-4 32-1l4 3c-9 4-28 4-37 1z" opacity=".88"/>
        <path d="M563 66c9-2 21-3 26 0l3 3c-8 2-23 2-30 0z"/>
      </g>
      <path d="M0 0h170v230H0z" fill="#12392e"/><path d="M169 0h110v230H169z" fill="url(#hero-fade)" transform="translate(448 0) scale(-1 1)"/>
    </svg>`;
  }

  function stat(label, symbol, value, unit, note, target, percent = null) {
    return `<button type="button" class="stat" data-action="stat" data-id="${target}">
      <span class="stat-label"><span class="stat-icon">${icon(symbol, 16)}</span>${label}</span>
      <span class="stat-value"><strong>${value}</strong><span>${unit}</span></span>
      <span class="stat-sub">${note}</span>
      ${percent === null ? '' : `<span class="meter" aria-hidden="true"><span style="width:${percent}%"></span></span>`}
    </button>`;
  }

  function overviewPage() {
    const tasks = data.tasks.map(currentTask);
    const completed = tasks.filter(task => task.status === '완료').length;
    const percent = Math.round(100 * completed / tasks.length);
    const pending = tasks.filter(task => needsReview(task.status)).length;
    const day = data.days[dayIndex];
    const upcoming = tasks.filter(task => task.date === day.date && task.status !== '완료');
    return `<section class="hero" aria-labelledby="event-title">
      ${art()}
      <div class="hero-copy">
        <div class="kicker">2026 RETREAT DESK</div>
        <h1 id="event-title">징검다리 수련회</h1>
        <p>준비부터 현장 인계까지, 오늘 할 일을 한눈에.</p>
        <div class="hero-meta">
          <span>${icon('calendar', 15)} 11. 13 (금) – 11. 14 (토)</span>
          <span>${icon('pin', 15)} 청춘산장리조트</span>
        </div>
      </div>
    </section>
    <section class="stats" aria-label="운영 현황">
      ${stat('체크 완료', 'checklist', completed, `/ ${tasks.length}개`, `전체 진행률 ${percent}%`, 'all', percent)}
      ${stat('확인할 항목', 'alert', pending, '개', '확인 필요 · 미정', 'review')}
      ${stat('현장 큐', 'clock', cueMap.size, '개', `금요일 ${data.friday.length} · 토요일 ${data.saturday.length}`, 'cues')}
    </section>
    <section aria-labelledby="days-heading">
      <div class="section-head"><h2 id="days-heading">날짜별 준비</h2><span class="muted">11. 09 – 11. 15</span></div>
      <div class="day-strip" role="group" aria-label="준비 날짜">
        ${data.days.map((item, index) => `<button type="button" class="day-button" data-action="day" data-id="${index}" aria-pressed="${index === dayIndex}">
          <strong>${shortDate(item.date)}</strong><span>${['월', '화', '수', '목', '금', '토', '일'][index]}</span></button>`).join('')}
      </div>
      <div class="overview-grid">
        <article class="panel">
          <div class="panel-head"><h3>${shortDate(day.date)} ${h(day.title)}</h3></div>
          <div class="agenda">
            ${[['오전', day.morning], ['오후', day.afternoon], ['저녁·마감', day.evening], ['마무리 기준', day.finish]].map(([label, value], index) =>
              `<div${index === 3 ? ' class="finish"' : ''}><strong>${label}</strong><p>${h(value)}</p></div>`).join('')}
          </div>
        </article>
        <article class="panel">
          <div class="panel-head"><h3>남은 체크 <span class="badge">${upcoming.length}</span></h3>
          <button type="button" class="text-button" data-action="day-tasks">이 날짜 전체 <span aria-hidden="true">→</span></button></div>
          ${upcoming.length ? upcoming.slice(0, 4).map(taskRow).join('') : '<p class="muted">이 날짜의 준비를 모두 완료했습니다.</p>'}
        </article>
      </div>
    </section>`;
  }

  function title(kicker, heading, subtitle) {
    return `<header class="page-head"><p class="page-kicker">${kicker}</p><h1>${heading}</h1><p>${h(subtitle)}</p></header>`;
  }

  function searchControl(name, value, placeholder) {
    return `<label class="search">${icon('search', 17)}<input type="search" name="${name}" aria-label="${placeholder}" placeholder="${placeholder}" value="${h(value)}" autocomplete="off"></label>`;
  }

  function options(items, selected) {
    return items.map(([value, label]) => `<option value="${h(value)}"${value === selected ? ' selected' : ''}>${h(label)}</option>`).join('');
  }

  function selectControl(name, label, items, selected) {
    return `<select name="${name}" aria-label="${label}">${options(items, selected)}</select>`;
  }

  function checklistPage() {
    return `${title('PREPARATION', '운영 체크리스트', '날짜·팀·상태로 할 일을 찾고, 항목을 열어 완료 기준과 담당을 확인하세요.')}
      <div class="toolbar">
        ${searchControl('query', filters.query, '업무·담당자 검색')}
        ${selectControl('date', '날짜 필터', [['', '모든 날짜'], ...data.days.map(day => [dateOnly(day.date), shortDate(day.date)])], filters.date)}
        ${selectControl('team', '팀 필터', [['', '모든 팀'], ...teams.map(team => [team, team])], filters.team)}
        ${selectControl('status', '상태 필터', [['', '모든 상태'], ['review', '확인 필요·미정'], ...statuses.map(status => [status, status])], filters.status)}
      </div>
      <div id="results"></div>`;
  }

  function taskRow(task) {
    const done = task.status === '완료';
    return `<article class="task${done ? ' is-done' : ''}">
      <button type="button" class="tick" data-action="tick" data-id="${h(task.id)}" aria-label="${h(task.title)} 완료" aria-pressed="${done}">${done ? icon('check', 17) : ''}</button>
      <button type="button" class="task-link" data-action="task" data-id="${h(task.id)}">
        <strong>${h(task.title)}</strong>
        <small>${shortDate(task.date)} · ${h(task.team)} · ${h(task.deadline)}</small>
      </button>
      ${badge(task.status, statusTone(task.status))}
    </article>`;
  }

  function cuePage() {
    const notes = data.notes[`${cueDay === 'friday' ? '금요일' : '토요일'} 큐시트`];
    const items = [...new Set(data[cueDay].map(cue => cue.timing))];
    return `${title('FIELD SCHEDULE', '현장 큐시트', '시간, 장소, 담당과 다음 인계를 확인하세요.')}
      <div class="segment" role="group" aria-label="현장 날짜">
        <button type="button" data-action="cue-day" data-id="friday" aria-pressed="${cueDay === 'friday'}">11/13 금요일</button>
        <button type="button" data-action="cue-day" data-id="saturday" aria-pressed="${cueDay === 'saturday'}">11/14 토요일</button>
      </div>
      <p class="notice">${icon('alert', 17)}<span>${h(notes[0])}</span></p>
      <div class="toolbar">
        ${searchControl('cueQuery', cueQuery, '프로그램·장소·담당자 검색')}
        ${selectControl('timingFilter', '시간 근거 필터', [['', '모든 시간 근거'], ...items.map(item => [item, item])], timingFilter)}
      </div>
      <div id="results"></div>`;
  }

  function cueTime(cue) {
    if (!cue.start && !cue.end) return ['시각 미정', ''];
    if (!cue.start) return [`${cue.end.slice(11)} 전`, shortDate(cue.end)];
    const start = cue.start.slice(11);
    if (!cue.end) return [start, shortDate(cue.start)];
    const overnight = dateOnly(cue.start) !== dateOnly(cue.end);
    return [`${start}–${cue.end.slice(11)}`, overnight ? `${shortDate(cue.start)} → ${shortDate(cue.end)}` : shortDate(cue.start)];
  }

  function cueRow(cue) {
    const [time, day] = cueTime(cue);
    const tone = /재확인|미정|예정/.test(cue.timing) ? 'warn' : 'standard';
    return `<article class="cue">
      <div class="cue-time">${h(time)}${day ? `<small>${h(day)}</small>` : ''}</div>
      <button type="button" class="cue-card" data-action="cue" data-id="${h(cue.id)}">
        <span class="cue-card-top">${badge(cue.timing, tone)}<small>${h(cue.id)} · ${h(cue.place)}</small></span>
        <strong>${h(cue.title)}</strong>
        <p>${h(cue.owner)}</p>
      </button>
    </article>`;
  }

  function boothPage() {
    const notes = data.notes['레크 10부스'];
    return `${title('SATURDAY ACTIVITIES', '레크 10부스', notes[0])}
      <p class="notice">${icon('alert', 17)}<span>${h(notes[1])}</span></p>
      <div class="section-head"><h2>부스 목록</h2><span class="muted">${h(data.boothNotes[0].split(' · ')[0])}</span></div>
      <div class="booths">
        ${data.booths.map(row => {
          const booth = {...row, ...records.booths[row.id]};
          return `<button type="button" class="booth-card" data-action="booth" data-id="${booth.id}">
            <span class="booth-num">${String(booth.id).padStart(2, '0')}</span>
            <span><strong>${h(booth.title)}</strong><small>${h(booth.owner)} · ${booth.minutes == null ? '실측 미입력' : `${h(booth.minutes)}분`}</small><br>
            ${badge(booth.status, statusTone(booth.status))}</span>
          </button>`;
        }).join('')}
      </div>`;
  }

  function matches(query, ...fields) {
    const terms = query.toLowerCase().trim().split(/\s+/);
    const text = fields.filter(Boolean).join(' ').toLowerCase();
    return terms.every(term => text.includes(term));
  }

  function renderResults() {
    const results = document.getElementById('results');
    if (!results) return;
    const checklist = view === 'checklist';
    const rows = checklist ? data.tasks.map(currentTask).filter(task =>
      (!filters.date || dateOnly(task.date) === filters.date) &&
      (!filters.team || task.team === filters.team) &&
      (!filters.status || (filters.status === 'review' ? needsReview(task.status) : task.status === filters.status)) &&
      matches(filters.query, task.id, task.title, task.owner, task.team, task.criteria, task.memo)
    ) : data[cueDay].filter(cue =>
      (!timingFilter || cue.timing === timingFilter) &&
      matches(cueQuery, cue.id, cue.title, cue.place, cue.owner, cue.action, cue.handoff, ...cueTime(cue))
    );
    results.innerHTML = `<div class="results-meta" tabindex="-1"><span>표시 ${rows.length}개</span><button type="button" class="text-button" data-action="clear">필터 초기화</button></div>
      ${rows.length ? `<div class="list">${rows.map(checklist ? taskRow : cueRow).join('')}</div>` : '<p class="empty">조건에 맞는 항목이 없습니다. 검색어나 필터를 바꿔 보세요.</p>'}`;
  }

  function detail(entries) {
    return `<dl class="detail">${entries.filter(([, value]) => value).map(([label, value]) =>
      `<div><dt>${h(label)}</dt><dd>${h(value)}</dd></div>`
    ).join('')}</dl>`;
  }

  function callout(label, value) {
    return `<div class="callout"><strong>${h(label)}</strong>${h(value)}</div>`;
  }

  function openDialog(kicker, heading, body) {
    if (!dialog.open) returnFocus = document.activeElement;
    dialogContent.innerHTML = `<div class="dialog-head"><div><p>${h(kicker)}</p><h2 id="dialog-title">${h(heading)}</h2></div>
      <button class="icon-button" type="button" aria-label="닫기" data-action="close">${icon('close', 18)}</button></div>
      <div class="dialog-body">${body}</div>`;
    if (!dialog.open) dialog.showModal();
    dialog.scrollTop = 0;
    dialog.querySelector('.icon-button').focus();
  }

  function statusField(selected, label = '상태') {
    return `<label class="field">${label}<select name="status" aria-label="${label}">${options(statuses.map(status => [status, status]), selected)}</select></label>`;
  }

  function memoField(label, value, placeholder) {
    return `<label class="field">${label}<textarea name="memo" maxlength="4000" placeholder="${h(placeholder)}">${h(value)}</textarea></label>`;
  }

  function saveActions() {
    return '<div class="dialog-actions"><button type="button" class="secondary" data-action="close">닫기</button><button type="submit" class="primary">기록 저장</button></div>';
  }

  function taskDetails(id) {
    const task = currentTask(taskMap.get(id));
    openDialog(`${task.id} · ${shortDate(task.date)} · ${task.team}`, task.title,
      detail([['마감 구분', task.deadline], ['담당·협의', task.owner], ['담당 근거', task.ownerBasis], ['자료 근거', task.source]]) +
      callout('완료 기준', task.criteria) +
      `<form data-kind="tasks" data-id="${h(id)}">${statusField(task.status)}${memoField('회의 확정·메모', task.memo, '확정 담당, 현장 인수자, 확인 내용을 적으세요.')}${saveActions()}</form>`
    );
  }

  function cueDetails(id) {
    const cue = cueMap.get(id);
    const [time, date] = cueTime(cue);
    const related = (cue.links || '').split('·').filter(Boolean);
    openDialog(`${cue.id} · ${date} ${time}`, cue.title,
      detail([['시간 근거', cue.timing], ['장소', cue.place], ['담당·협의', cue.owner], ['담당 근거', cue.ownerBasis], ['자료 근거', cue.source]]) +
      callout('현장 행동', cue.action) + callout('종료·다음 인계', cue.handoff) +
      (related.length ? `<h3>연결된 체크 항목</h3>${related.map(id => taskRow(currentTask(taskMap.get(id)))).join('')}` : '')
    );
  }

  function boothDetails(id) {
    const booth = {...boothMap.get(id), ...records.booths[id]};
    openDialog(`BOOTH ${String(id).padStart(2, '0')}`, booth.title,
      detail([['공지 담당', booth.owner]]) + callout('준비·실측 기준', booth.criteria) +
      (id === '7' ? callout('7번 부스 운영 메모', data.boothNotes[1]) : '') +
      `<p class="muted">${h(data.boothNotes[0])}</p>
      <form data-kind="booths" data-id="${id}">
        ${statusField(booth.status, '배점·게시 상태')}
        <label class="field">실측 시간 (분)<input name="minutes" type="number" min="0" step="any" placeholder="실측 후 입력" value="${h(booth.minutes)}"></label>
        ${memoField('장소·대행·인계 메모', booth.memo, '부스 위치와 인수자를 적으세요.')}${saveActions()}
      </form>`
    );
  }

  function sources() {
    openDialog('WORKBOOK', '원본 및 근거',
      '<p class="muted">2026 징검다리수련회 운영체크리스트 큐시트 · 11/9 23:39 확보분</p>' +
      `<ul class="source-list">${data.sources.map(([key, value]) => `<li><strong>${h(key)}</strong> · ${h(value)}</li>`).join('')}</ul>` +
      `<div class="callout">${h(data.notes['날짜별 준비'][1])}<br>${h(data.notes['체크리스트'][1])}<br>${h(data.notes['금요일 큐시트'][1])}</div>`
    );
  }

  function recordManager() {
    openDialog('LOCAL RECORDS', '내 기록 관리',
      `<p>체크 상태, 메모, 부스 실측값은 현재 브라우저에 저장됩니다. 다른 기기에서 이어서 쓰려면 기록을 내려받아 같은 원본의 웹앱에서 가져오세요.</p>
       <div class="dialog-actions"><button type="button" class="secondary" data-action="export">기록 내려받기</button><button type="button" class="primary" data-action="choose-import">기록 가져오기</button></div>
       <input id="backup-file" type="file" accept=".json,application/json" hidden>
       <div id="import-preview" role="status"></div>`
    );
  }

  function downloadRecords() {
    const url = URL.createObjectURL(new Blob([JSON.stringify({version: 1, source: data.key, records}, null, 2)], {type: 'application/json'}));
    const link = document.createElement('a');
    link.href = url;
    link.download = '징검다리_운영기록.json';
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  async function previewImport(input) {
    const file = input.files[0];
    const preview = document.getElementById('import-preview');
    if (!file || !preview) return;
    input.value = '';
    try {
      if (file.size > 3000000) throw new Error('백업 파일이 너무 큽니다.');
      const backup = JSON.parse(await file.text());
      if (backup?.version !== 1 || backup.source !== data.key) throw new Error('이 원본에 해당하는 백업 파일을 선택해 주세요.');
      const incoming = validateRecords(backup.records);
      const count = Object.keys(incoming.tasks).length + Object.keys(incoming.booths).length;
      preview.innerHTML = `<p class="callout">백업에 기록 ${count}개가 있습니다. 같은 항목의 기록은 백업 내용으로 바뀝니다.</p>
        <div class="dialog-actions"><button class="primary" type="button">가져오기 적용</button></div>`;
      preview.querySelector('button').addEventListener('click', () => {
        records.tasks = {...records.tasks, ...incoming.tasks};
        records.booths = {...records.booths, ...incoming.booths};
        persist('기록을 가져왔습니다.');
        dialog.close();
        render();
      });
    } catch (error) {
      preview.innerHTML = callout('백업을 읽을 수 없습니다', error.message);
    }
  }

  function refocus(action, id) {
    const target = document.querySelector(`button[data-action="${action}"][data-id="${id}"]`);
    (target || document.querySelector('.results-meta') || main).focus({preventScroll: true});
  }

  function toggleTask(id) {
    const task = currentTask(taskMap.get(id));
    const markDone = task.status !== '완료';
    records.tasks[id] = {
      status: markDone ? '완료' : (task.beforeDone ?? '대기'),
      memo: task.memo ?? '',
      beforeDone: markDone ? task.status : undefined,
    };
    persist(markDone ? '완료로 표시했습니다.' : '완료 표시를 해제했습니다.');
    render();
    if (dialog.open) {
      const cue = dialogContent.dataset.cue;
      if (cue) cueDetails(cue);
    } else {
      refocus('tick', id);
    }
  }

  document.addEventListener('click', event => {
    const button = event.target.closest('button[data-action]');
    if (!button) return;
    const {action, id} = button.dataset;
    switch (action) {
      case 'nav': navigate(id); break;
      case 'day':
        dayIndex = Number(id);
        render();
        refocus(action, id);
        break;
      case 'stat':
        if (id === 'cues') { navigate('cues'); break; }
        filters = freshFilters();
        if (id === 'review') filters.status = 'review';
        navigate('checklist');
        break;
      case 'day-tasks':
        filters = {...freshFilters(), date: dateOnly(data.days[dayIndex].date)};
        navigate('checklist');
        break;
      case 'tick': toggleTask(id); break;
      case 'task': taskDetails(id); break;
      case 'cue':
        dialogContent.dataset.cue = id;
        cueDetails(id);
        break;
      case 'booth': boothDetails(id); break;
      case 'cue-day':
        cueDay = id;
        timingFilter = '';
        render();
        refocus(action, id);
        break;
      case 'clear':
        if (view === 'checklist') filters = freshFilters();
        else { cueQuery = ''; timingFilter = ''; }
        render();
        main.querySelector('input[type="search"]').focus({preventScroll: true});
        break;
      case 'sources': sources(); break;
      case 'close':
        if (dialogContent.dataset.cue && dialog.querySelector('form')) cueDetails(dialogContent.dataset.cue);
        else dialog.close();
        break;
      case 'export': downloadRecords(); break;
      case 'choose-import': document.getElementById('backup-file').click(); break;
    }
  });

  document.addEventListener('input', event => {
    if (event.target.name === 'query') filters.query = event.target.value;
    else if (event.target.name === 'cueQuery') cueQuery = event.target.value;
    else return;
    renderResults();
  });

  document.addEventListener('change', event => {
    const {name, value} = event.target;
    if (event.target.id === 'backup-file') { void previewImport(event.target); return; }
    if (!main.contains(event.target)) return;
    if (['date', 'team', 'status'].includes(name)) filters[name] = value;
    else if (name === 'timingFilter') timingFilter = value;
    else return;
    renderResults();
  });

  dialog.addEventListener('submit', event => {
    event.preventDefault();
    const form = event.target;
    const {kind, id} = form.dataset;
    const fields = new FormData(form);
    const row = {status: fields.get('status'), memo: fields.get('memo').trim()};
    if (kind === 'booths') {
      row.minutes = fields.get('minutes') === '' ? null : Number(fields.get('minutes'));
    } else if (row.status === '완료') {
      const task = currentTask(taskMap.get(id));
      row.beforeDone = task.status === '완료' ? task.beforeDone : task.status;
    }
    records[kind][id] = row;
    persist('기록을 저장했습니다.');
    render();
    if (dialogContent.dataset.cue) cueDetails(dialogContent.dataset.cue);
    else {
      dialog.close();
      refocus(kind === 'tasks' ? 'task' : 'booth', id);
    }
  });

  dialog.addEventListener('cancel', event => {
    if (dialogContent.dataset.cue && dialog.querySelector('form')) {
      event.preventDefault();
      cueDetails(dialogContent.dataset.cue);
    }
  });
  dialog.addEventListener('close', () => {
    delete dialogContent.dataset.cue;
    if (returnFocus?.isConnected) returnFocus.focus({preventScroll: true});
  });
  document.getElementById('storage').addEventListener('click', recordManager);
  window.addEventListener('popstate', () => {
    if (dialog.open) dialog.close();
    view = readView();
    render();
  });
  window.addEventListener('storage', event => {
    if (event.key !== storageKey) return;
    try {
      records = event.newValue ? validateRecords(JSON.parse(event.newValue)) : freshRecords();
      if (!dialog.open && !main.contains(document.activeElement)) render();
      else renderResults();
    } catch { /* Retain the current records when an invalid backup is written externally. */ }
  });
  document.querySelector('.brand-icon').innerHTML = icon('stones', 24);
  document.querySelector('.mini-calendar').innerHTML = icon('calendar', 19);
  updateStorageLabel();
  render();
})();</script>
</body>
</html>
